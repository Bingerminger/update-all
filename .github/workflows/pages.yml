name: Projektseite

# Die Projektseite auf GitHub Pages (https://bingerminger.github.io/update-all/): site/ plus
# die Bilder aus docs/ (tools/build-site.sh). Gebaut wird aus main — Texte, Links und das
# Impressum lassen sich so ohne Release nachziehen; angezeigt wird die Version des neuesten
# Releases. Ausgelöst:
#   • beim Veröffentlichen eines GitHub-Releases
#   • von Hand
on:
  release:
    types: [published]
  workflow_dispatch:

# Gebaut wird nur mit Leserechten; schreiben darf allein der Job, der veröffentlicht,
# und der führt nur Actions von GitHub selbst aus.
permissions:
  contents: read

# Eine Veröffentlichung zur Zeit; eine neuere ersetzt eine wartende.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Seite bauen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Die Seite kommt aus main (Texte, Links, Impressum lassen sich ohne Release nachziehen);
      # angezeigt wird die Version des neuesten Releases.
      - name: Version des neuesten Releases
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          [ -n "$TAG" ] || TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          echo "SITE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Seite aus main, Version ${TAG#v}"

      - name: Seite bauen
        run: |
          bash tools/build-site.sh --check
          bash tools/build-site.sh dist/site

      - name: Hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    name: Seite veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages einrichten
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
